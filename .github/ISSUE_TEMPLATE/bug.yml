name: Bug
description: Something is broken or wrong.
title: "[Bug]: "
labels: ["bug"]
type: Bug
projects: ["meridiq/1"]
body:
  - type: markdown
    attributes:
      value: |
        Use IDs only. No names, contact details or patient data.
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options:
        - Production
        - Test server
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: ids
    attributes:
      label: IDs
      value: |
        Company ID:
        User ID:
        Record IDs:
    validations:
      required: true
  - type: input
    id: when
    attributes:
      label: When did it happen?
      placeholder: Date and time, with time zone
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Who is affected, how many, and can they work around it?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Drag images here. Blur any personal or patient data first.
  - type: input
    id: crisp
    attributes:
      label: Crisp link
